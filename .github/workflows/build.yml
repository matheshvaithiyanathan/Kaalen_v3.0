name: Build and Package Multi-Platform App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # STEP 1: Build raw binaries for Windows, macOS, and Linux
  build-binaries:
    name: Build Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-14, ubuntu-22.04]
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.2.0 -r requirements.txt

      - name: Build with PyInstaller
        # We use the .spec file for ALL OSes to enforce a "onedir" (folder) build.
        # This guarantees the hiddenimports fix is applied to Windows, Mac, and Linux.
        run: |
          python -m PyInstaller -y --clean Kaalen_v3.spec
          
          # For Linux, grant execution permissions to the generated binary inside the folder
          if [ "${{ matrix.os }}" == "ubuntu-22.04" ]; then
            chmod +x dist/Kaalen_v3/Kaalen_v3
          fi
        shell: bash

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kaalen-${{ matrix.os }}
          path: dist/
          retention-days: 1

  # STEP 2: Create the Windows Installer (Runs only AFTER windows binary is built)
  create-windows-installer:
    name: Compile Windows Installer
    needs: build-binaries
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: Kaalen-windows-latest
          path: dist/

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Compile Installer
        # This compiles the installer using the folder outputted by the Windows build step
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "Kaalen_v3_Installer.iss"'

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kaalen-Windows-Setup
          path: Output_Installer/Kaalen_v3_windows_Setup.exe

  # STEP 3: Combine everything into one single Release
  create-release:
    needs: [build-binaries, create-windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare Release Assets
        run: |
          mkdir assets
          
          # Zip the contents of the Mac and Linux artifact folders 
          # We use '.' to grab everything inside the downloaded artifact directory
          cd all-artifacts/Kaalen-macos-14 && zip -r ../../assets/Kaalen-v3-macOS.zip . && cd ../..
          cd all-artifacts/Kaalen-ubuntu-22.04 && zip -r ../../assets/Kaalen-v3-Linux.zip Kaalen_v3 && cd ../..
          
          # Copy the compiled Windows Setup.exe
          cp all-artifacts/Kaalen-Windows-Setup/Kaalen_v3_windows_Setup.exe assets/Kaalen_v3_Windows_Setup.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0-${{ github.sha }}
          name: Kaalen v3.0 Release
          files: assets/*
          body: |
            Standalone Spectroscopy Data Analysis Tool.
            
            - **Windows**: Download and run `Kaalen_v3_Windows_Setup.exe` to install the software to your Start Menu.
            - **Linux**: Download and extract `Kaalen-v3-Linux.zip`. Open the `Kaalen_v3` folder in your terminal and run `./Kaalen_v3`.
            - **macOS**: Download and extract `Kaalen-v3-macOS.zip` and run the executable.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
